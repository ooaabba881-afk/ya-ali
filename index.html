
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>به‌زودی...</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #050505;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Tahoma, sans-serif;
  overflow: hidden;
}

.container {
  text-align: center;
  padding: 20px;
}

h1 {
  font-size: clamp(30px, 8vw, 55px);
  font-weight: bold;
  background: linear-gradient(
    90deg,
    red,
    orange,
    yellow,
    lime,
    cyan,
    blue,
    violet,
    red
  );
  background-size: 300%;
  color: transparent;
  background-clip: text;
  -webkit-background-clip: text;
  animation: rainbow 4s linear infinite;
}

p {
  color: white;
  font-size: 20px;
  margin-top: 25px;
  animation: glow 2s ease-in-out infinite alternate;
}

.line {
  width: 180px;
  height: 4px;
  margin: 30px auto;
  border-radius: 20px;
  background: linear-gradient(
    90deg,
    red,
    orange,
    yellow,
    lime,
    cyan,
    blue,
    violet
  );
  background-size: 300%;
  animation: rainbow 3s linear infinite;
}

@keyframes rainbow {
  0% { background-position: 0% center; }
  100% { background-position: 300% center; }
}

@keyframes glow {
  from { text-shadow: 0 0 5px white; }
  to { text-shadow: 0 0 20px cyan; }
}
</style>
</head>

<body>

<div class="container">
  <h1>منتظر سایت‌مون باشین 🌈</h1>
  <div class="line"></div>
  <p>یه اتفاق خفن در راهه...</p>
</div>

</body>
</html>
