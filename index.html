
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پخش ویدئو</title>

<style>
body {
  background: #111;
  color: white;
  text-align: center;
  font-family: Tahoma;
  padding-top: 100px;
}

.play-btn {
  background: linear-gradient(45deg, #ff0055, #8e2de2);
  color: white;
  border: 3px solid white;
  border-radius: 40px;
  padding: 18px 35px;
  font-size: 23px;
  font-weight: bold;
  cursor: pointer;
  animation: glow 1.5s infinite;
}

@keyframes glow {
  0%, 100% {
    box-shadow: 0 0 10px #ff0055;
  }
  50% {
    box-shadow: 0 0 35px #a020f0;
  }
}

#video {
  display: none;
  margin: 35px auto;
  width: 90%;
  max-width: 700px;
  aspect-ratio: 16 / 9;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
  border-radius: 15px;
}
</style>
</head>

<body>

<h2>🎬 برای تماشای ویدئو آماده‌ای؟</h2>

<button class="play-btn" onclick="playVideo()">
▶ پخش ویدئو
</button>

<div id="video"></div>

<script>
function playVideo() {
  document.getElementById("video").style.display = "block";

  document.getElementById("video").innerHTML = `
    <iframe
      src="https://www.aparat.com/video/video/embed/videohash/xnj0z25/vt/frame?autoplay=1"
      allowfullscreen
      allow="autoplay; encrypted-media">
    </iframe>
  `;

  document.querySelector(".play-btn").style.display = "none";
}
</script>

</body>
</html>
